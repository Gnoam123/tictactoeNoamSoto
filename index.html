<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071024">
    <title>איקס עיגול דינמי</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs" aria-hidden="true"></div>

    <div id="loginModal" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <form id="loginForm" class="login-card">
            <h2 id="loginTitle">התחברות למשחק</h2>

            <label class="sr-only" for="loginUser">שם משתמש</label>
            <input type="text" id="loginUser" placeholder="שם משתמש" autocomplete="username" required>

            <label class="sr-only" for="loginPass">סיסמה</label>
            <input type="password" id="loginPass" placeholder="סיסמה" autocomplete="current-password" required>

            <button id="loginBtn" type="submit">היכנס</button>
            <p id="loginError" class="form-error is-hidden" role="alert">שם משתמש או סיסמה שגויים!</p>
        </form>
    </div>

    <div id="adminModal" class="admin-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle">
        <div class="admin-modal-content">
            <button id="closeAdminBtn" class="close-admin-btn" type="button">✖ סגור חלון</button>
            <h2 id="adminModalTitle">נתונים</h2>
            <div class="table-responsive">
                <table id="adminTable"></table>
            </div>
        </div>
    </div>



    <div class="app-shell">
        <div class="layout">
            <aside class="sidebar" aria-label="כותרת ובקרות משחק">
                <header class="site-header">
                    <h1>איקס עיגול דינמי</h1>
                    <p>בחרו מצב, גודל לוח ורצף לניצחון</p>
                </header>

                <section class="controls" role="region" aria-label="בקרות משחק">
                    <div class="group mode-group">
                        <span class="control-label">בחר מצב משחק</span>
                        <div class="mode-buttons" role="tablist" aria-label="מצב משחק">
                            <button class="mode active" data-mode="local" type="button" role="tab" aria-selected="true">1 VS 1</button>
                            <button class="mode" data-mode="ai" type="button" role="tab" aria-selected="false">AI</button>
                            <button class="mode" data-mode="online" type="button" role="tab" aria-selected="false">Online</button>
                        </div>
                    </div>

                    <div class="settings-grid">
                        <div class="group">
                            <label for="cols">רוחב הלוח</label>
                            <span class="field-help">עמודות</span>
                            <input type="number" id="cols" min="3" max="50" value="3" inputmode="numeric">
                        </div>

                        <div class="group">
                            <label for="rows">אורך הלוח</label>
                            <span class="field-help">שורות</span>
                            <input type="number" id="rows" min="3" max="50" value="3" inputmode="numeric">
                        </div>

                        <div class="group">
                            <label for="winLength">רצף לניצחון</label>
                            <span class="field-help">מספר סימנים</span>
                            <input type="number" id="winLength" min="3" max="50" value="3" inputmode="numeric">
                        </div>
                    </div>

                    <button id="resetBtn" class="primary-button" type="button">משחק חדש</button>
                </section>
            </aside>

            <main class="main" role="main">
                <div class="game-card">
                    <div class="game-card-header">
                        <h2>לוח המשחק</h2>
                        <span class="legend"><b class="legend-x">X</b> מול <b class="legend-o">O</b></span>
                    </div>

                    <div class="board-wrap" aria-live="polite">
                        <div id="board" class="board" aria-label="לוח משחק"></div>

                        <div id="resultModal" class="result-modal" role="status" aria-live="assertive" aria-atomic="true">
                            <div id="resultCard" class="result-card">
                                <div id="resultIcon" class="result-icon" aria-hidden="true"></div>
                                <div class="result-copy">
                                    <h2 id="resultTitle"></h2>
                                    <p id="resultText"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="status" role="status" aria-live="polite"></div>
                </div>
            </main>

            <section id="adminPanel" class="admin-panel is-hidden" aria-label="פאנל ניהול">
                <div class="admin-title">👑 פאנל ניהול</div>
                <div class="admin-actions">
                    <button id="adminUsersBtn" type="button">👥 משתמשים</button>
                    <button id="adminGamesBtn" type="button">🎮 היסטוריה</button>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
